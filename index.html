<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>保健品管理</title>
  <meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="保健品" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" />
  <style>
    /* 版面：淺灰底上的白色浮動卡片、每頁大標題、單一主色；手機全螢幕，桌機置中一欄 */
    :root {
      --bg: #f3f5f8; --surface: #ffffff; --surface-2: #f1f3f7; --fg: #191c23; --muted: #6a7282; --line: #e6e9ef;
      --accent: #0e9f6e; --accent-ink: #ffffff; --accent-soft: #e2f5ec;
      --warn: #c26a00; --warn-soft: #fdf1dd; --danger: #e11d48; --danger-soft: #fde7ec; --buy: #5b54e8; --buy-soft: #ebeafd;
      --c-blue: #3b82f6; --c-blue-soft: #e5eefe; --c-violet: #8b5cf6; --c-violet-soft: #efe9fe;
      --c-amber: #e89a06; --c-amber-soft: #fdf3dc; --c-rose: #f43f5e; --c-rose-soft: #fde7eb;
      --c-teal: #0fa99a; --c-teal-soft: #dcf6f2; --c-orange: #f26b1d; --c-orange-soft: #feece0;
      --shadow: 0 1px 2px rgba(22, 30, 48, .04), 0 6px 18px rgba(22, 30, 48, .06);
      --shadow-lift: 0 2px 4px rgba(22, 30, 48, .06), 0 14px 32px rgba(22, 30, 48, .12);
      --font: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      --font-round: "Outfit", -apple-system, "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
      --ease-out: cubic-bezier(.2, .8, .2, 1); --ease-in: cubic-bezier(.4, 0, 1, 1);
      --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1116; --surface: #181c23; --surface-2: #20252e; --fg: #eceff4; --muted: #99a2b2; --line: #2a303a;
        --accent: #34d399; --accent-ink: #062a1d; --accent-soft: #143528;
        --warn: #fbbf57; --warn-soft: #3a2c10; --danger: #fb7190; --danger-soft: #3d1620; --buy: #a5a1ff; --buy-soft: #26254a;
        --c-blue: #7aa9ff; --c-blue-soft: #1a2a45; --c-violet: #b69cff; --c-violet-soft: #2a2145;
        --c-amber: #fbc553; --c-amber-soft: #372a10; --c-rose: #ff8aa0; --c-rose-soft: #3e1a23;
        --c-teal: #4fd8c7; --c-teal-soft: #12332f; --c-orange: #ffa066; --c-orange-soft: #3b2415;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); --shadow-lift: 0 14px 32px rgba(0,0,0,.45);
        color-scheme: dark;
      }
    }

    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button, a, input { touch-action: manipulation; }
    button:disabled { cursor: default; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    [hidden] { display: none !important; }
    svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .r { font-family: var(--font-round); font-variant-numeric: tabular-nums; }

    /* ---------- shell ---------- */
    .app { position: relative; height: 100vh; height: 100dvh; max-width: 640px; margin: 0 auto; display: grid; grid-template-rows: 1fr auto; overflow: hidden; overflow: clip; }
    @media (min-width: 700px) { .app { box-shadow: 0 0 0 1px var(--line); } }
    .scroller { overflow-y: auto; overscroll-behavior: contain; padding-top: var(--safe-top); }
    .screen { padding: 12px 16px 104px; display: flex; flex-direction: column; gap: 14px; }
    .screen.enter { animation: enter .22s var(--ease-out); }
    @keyframes enter { from { opacity: 0; transform: translateY(8px); } }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; padding: 8px 2px 2px; }
    .page-head small { display: block; font-size: 14px; color: var(--muted); font-weight: 500; }
    .page-head h1 { margin: 0; font-family: var(--font-round); font-size: 30px; font-weight: 600; line-height: 1.15; letter-spacing: -.01em; }
    .head-actions { display: flex; align-items: center; gap: 2px; }
    .sync { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 13px; color: var(--muted); padding: 0 8px; white-space: nowrap; border: 0; background: transparent; border-radius: 22px; }
    .sync .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .sync.online .dot { background: var(--accent); }
    .sync.offline { color: var(--warn); }
    .sync.offline .dot { background: var(--warn); }
    .sync .spin { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 50%; color: var(--muted); }
    .icon-btn:active, .sync:active { background: var(--surface-2); }

    .tabbar { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); box-shadow: 0 -1px 0 var(--line); padding-bottom: max(4px, var(--safe-bottom)); }
    .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 58px; border: 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: 500; position: relative; }
    .tab[aria-selected="true"] { color: var(--accent); font-weight: 600; }
    .tab:active { background: var(--surface-2); }
    .tab .badge { position: absolute; top: 7px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; line-height: 18px; text-align: center; font-family: var(--font-round); }
    .fab { position: absolute; right: 18px; bottom: calc(80px + var(--safe-bottom)); width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: var(--shadow-lift); z-index: 5; transition: transform .15s var(--ease-out); }
    .fab:active { transform: scale(.94); }
    .fab svg.i { width: 26px; height: 26px; }

    /* ---------- building blocks ---------- */
    .card { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); }
    .label { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 6px 4px 0; }
    .label h2 { margin: 0; font-size: 15px; font-weight: 600; }
    .label span { font-size: 13px; color: var(--muted); }
    .muted { color: var(--muted); }
    .btn { min-height: 46px; padding: 0 18px; border-radius: 14px; border: 0; background: var(--surface-2); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: var(--fg); transition: transform .12s var(--ease-out); }
    .btn:active { transform: scale(.98); }
    .btn.primary { background: var(--accent); color: var(--accent-ink); }
    .btn.buy { background: var(--buy); color: #fff; }
    .btn.soft { background: var(--accent-soft); color: var(--accent); }
    .btn.ghost-danger { background: transparent; color: var(--danger); }
    .btn.confirm { background: var(--danger); color: #fff; }
    .btn.small { min-height: 40px; font-size: 14px; padding: 0 14px; }
    .note-line { font-size: 14px; color: var(--muted); margin: 0; }
    .empty { text-align: center; padding: 28px 16px; color: var(--muted); font-size: 15px; }

    /* 品項圖示：顏色依品項、形狀依劑型（用 <i> 避免被 span 的通用樣式影響） */
    .pill { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; font-style: normal; }
    .pill svg { width: 24px; height: 24px; }
    .pill.blue { background: var(--c-blue-soft); color: var(--c-blue); }
    .pill.violet { background: var(--c-violet-soft); color: var(--c-violet); }
    .pill.amber { background: var(--c-amber-soft); color: var(--c-amber); }
    .pill.rose { background: var(--c-rose-soft); color: var(--c-rose); }
    .pill.teal { background: var(--c-teal-soft); color: var(--c-teal); }
    .pill.orange { background: var(--c-orange-soft); color: var(--c-orange); }

    /* ---------- today ---------- */
    .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .wday { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0 8px; border: 1.5px solid transparent; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); font-size: 12px; color: var(--muted); }
    .wday.sel { border-color: var(--accent); }
    .wday.future { box-shadow: none; background: transparent; }
    .wday b { font-family: var(--font-round); font-size: 15px; font-weight: 600; color: var(--fg); }
    .ring { width: 28px; height: 28px; }
    .ring circle { fill: none; stroke-width: 3; }
    .ring .bgc { stroke: var(--line); }
    .ring .fgc { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .35s var(--ease-out); }
    .ring .full { fill: var(--accent); stroke: none; }
    .ring .tick { stroke: var(--accent-ink); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .day-sum { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; }
    .day-sum p { margin: 0; font-size: 15px; }
    .day-sum p span { display: block; font-size: 13px; color: var(--muted); }
    .day-sum .big { font-family: var(--font-round); font-size: 34px; font-weight: 600; line-height: 1; white-space: nowrap; }
    .day-sum .big small { font-size: 16px; color: var(--muted); font-weight: 500; }
    .all-done { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 15px; animation: enter .25s var(--ease-out); }
    .slot-label { display: flex; align-items: center; gap: 8px; padding: 8px 4px 0; }
    .slot-label h2 { margin: 0; font-size: 15px; font-weight: 600; }
    .slot-label .t { font-family: var(--font-round); font-size: 15px; color: var(--muted); }
    .slot-label .n { margin-left: auto; font-family: var(--font-round); font-size: 14px; color: var(--muted); }
    .now-tag { font-size: 12px; font-weight: 700; color: var(--accent-ink); background: var(--accent); border-radius: 999px; padding: 1px 8px; }
    .dose-list { display: flex; flex-direction: column; gap: 10px; }
    .dose-card { display: flex; align-items: center; gap: 4px; padding: 0 8px 0 0; min-height: 76px; }
    .dose-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 12px 6px 12px 14px; border: 0; background: transparent; text-align: left; align-self: stretch; border-radius: 20px 0 0 20px; }
    .dose-main .txt { min-width: 0; }
    .dose-main b { display: block; font-size: 16px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
    .dose-main .sub { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dose-card.done .dose-main b { color: var(--muted); }
    .qty { flex: none; min-width: 52px; min-height: 44px; border: 0; border-radius: 12px; background: var(--surface-2); font-size: 13px; color: var(--muted); display: inline-flex; align-items: baseline; justify-content: center; gap: 2px; padding: 11px 8px 0; box-sizing: border-box; }
    .qty b { font-family: var(--font-round); font-size: 18px; font-weight: 600; color: var(--fg); }
    .check { flex: none; width: 44px; height: 44px; border: 0; background: transparent; display: grid; place-items: center; padding: 0; }
    .check i { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; box-sizing: border-box; }
    .check svg.i { width: 17px; height: 17px; stroke-width: 2.8; }
    .dose-card.done .check i { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .dose-card.pop .check i { animation: pop .26s var(--ease-out); }
    @keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
    .dose-main:active, .qty:active { background: var(--surface-2); }
    .slot-all { align-self: flex-start; }

    /* ---------- inventory ---------- */
    .alert { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .alert-top { display: flex; align-items: center; gap: 10px; }
    .alert-top .ic { width: 36px; height: 36px; border-radius: 50%; background: var(--warn-soft); color: var(--warn); display: grid; place-items: center; flex: none; }
    .alert-top b { font-size: 16px; }
    .alert ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
    .alert li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 15px; }
    .alert li > span:first-child { min-width: 0; }
    .alert li > span:last-child { font-size: 14px; color: var(--muted); white-space: nowrap; }
    .alert li em { font-style: normal; font-family: var(--font-round); font-weight: 600; color: var(--fg); }
    .alert li .late { color: var(--danger); font-weight: 600; }
    .alert-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .alert-foot span { font-size: 13px; color: var(--muted); }
    .alert.calm .alert-top .ic { background: var(--accent-soft); color: var(--accent); }
    .segmented { display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; gap: 4px; background: var(--surface-2); border-radius: 14px; }
    .segmented button { min-height: 40px; border: 0; border-radius: 11px; background: transparent; font-size: 15px; font-weight: 500; color: var(--muted); }
    .segmented button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: var(--shadow); }
    .inv-list { display: flex; flex-direction: column; gap: 10px; }
    .inv-head { width: 100%; border: 0; background: transparent; text-align: left; padding: 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; border-radius: 20px; }
    .inv-head:active { background: var(--surface-2); }
    .inv-head .pill { grid-row: span 2; }
    .inv-name { font-weight: 600; font-size: 16px; line-height: 1.3; min-width: 0; overflow-wrap: anywhere; }
    .inv-days { grid-row: span 2; text-align: right; line-height: 1; }
    .inv-days b { font-family: var(--font-round); font-size: 30px; font-weight: 600; }
    .inv-days small { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
    .inv-days.warn b { color: var(--warn); }
    .inv-days.danger b, .inv-days.empty b { color: var(--danger); }
    .inv-sub { font-size: 13px; color: var(--muted); min-width: 0; }
    .inv-sub .st { font-weight: 600; }
    .inv-sub .st.warn { color: var(--warn); }
    .inv-sub .st.danger, .inv-sub .st.empty { color: var(--danger); }
    .bar { grid-column: 1 / -1; position: relative; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
    .bar .cur { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
    .bar .cur.warn { background: var(--warn); }
    .bar .cur.danger, .bar .cur.empty { background: var(--danger); }
    .bar .buy { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, var(--buy) 0 3px, transparent 3px 6px); opacity: .6; }
    .bar .line30 { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--surface); }
    .inv-body { padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 10px; animation: enter .2s var(--ease-out); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .row label, .row .lbl { font-size: 15px; }
    .row label small, .row .lbl small { display: block; font-size: 13px; color: var(--muted); }
    .stepper { display: flex; align-items: center; background: var(--surface-2); border-radius: 14px; flex: none; }
    .stepper button { width: 44px; height: 44px; border: 0; background: transparent; font-size: 22px; line-height: 1; border-radius: 14px; }
    .stepper button:active { background: var(--line); }
    .stepper input { width: 48px; height: 44px; border: 0; text-align: center; font-family: var(--font-round); font-size: 19px; font-weight: 600; background: transparent; -moz-appearance: textfield; padding: 0; }
    .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .stepper.buy { background: var(--buy-soft); color: var(--buy); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .actions .btn { flex: 1 1 auto; }
    .choice { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .choice.three { grid-template-columns: repeat(3, 1fr); }
    .choice button { min-height: 46px; border-radius: 14px; border: 1.5px solid transparent; background: var(--surface-2); font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 6px; }
    .choice button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .choice .pill { width: 24px; height: 24px; background: transparent; }
    .choice .pill svg { width: 20px; height: 20px; }

    /* ---------- reminders ---------- */
    .switch-card { padding: 16px; display: flex; gap: 12px; align-items: center; }
    .switch-card b { display: block; font-size: 16px; }
    .switch-card span { font-size: 14px; color: var(--muted); }
    .switch { width: 52px; height: 32px; border-radius: 16px; border: 0; background: var(--line); position: relative; flex: none; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s var(--ease-out); }
    .switch[aria-checked="true"] { background: var(--accent); }
    .switch[aria-checked="true"]::after { transform: translateX(20px); }
    .tip-box { padding: 12px 14px; font-size: 14px; background: var(--warn-soft); color: var(--warn); border-radius: 16px; margin: 0; }
    .rem { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .rem-top { display: flex; align-items: center; gap: 10px; }
    .rem-top svg.i { color: var(--muted); }
    .rem-top input[type="time"] { font-family: var(--font-round); font-size: 26px; font-weight: 600; border: 0; background: transparent; padding: 0; min-height: 44px; }
    .rem-top input[type="time"]::-webkit-calendar-picker-indicator { display: none; }
    .rem-top .when { margin-left: auto; font-size: 14px; color: var(--muted); }
    .rem-items { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
    .rem-items .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; background: var(--surface-2); border-radius: 999px; padding: 4px 10px 4px 4px; }
    .rem-items .pill { width: 24px; height: 24px; }
    .rem-items .pill svg { width: 15px; height: 15px; }
    .tips { display: flex; flex-direction: column; }
    .tip { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
    .tip:first-child { border-top: 0; }
    .tip .txt { min-width: 0; }
    .tip b { display: block; font-size: 15px; font-weight: 600; }
    .tip p { margin: 0; font-size: 14px; color: var(--muted); }

    /* ---------- history ---------- */
    .rate { padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .rate b { font-family: var(--font-round); font-size: 36px; font-weight: 600; line-height: 1; color: var(--accent); }
    .rate p { margin: 0; font-size: 15px; }
    .rate p span { display: block; font-size: 13px; color: var(--muted); }
    .rate-side { display: flex; gap: 18px; text-align: right; }
    .rate-side b { display: block; font-size: 22px; color: var(--fg); }
    .rate-side span { font-size: 12px; color: var(--muted); }
    .cal { padding: 16px; }
    .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .cal-head b { font-size: 16px; font-weight: 600; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cal-grid .dow { text-align: center; font-size: 12px; color: var(--muted); }
    .day { aspect-ratio: 1; min-height: 38px; border: 0; border-radius: 10px; background: var(--surface-2); font-family: var(--font-round); font-size: 14px; font-weight: 500; color: var(--muted); display: grid; place-items: center; padding: 0; }
    .l1 { background: color-mix(in srgb, var(--accent) 22%, var(--surface-2)); color: var(--fg); }
    .l2 { background: color-mix(in srgb, var(--accent) 45%, var(--surface-2)); color: var(--fg); }
    .l3 { background: color-mix(in srgb, var(--accent) 70%, var(--surface-2)); color: var(--accent-ink); }
    .l4 { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
    .day.future { background: transparent; color: var(--line); }
    .day.sel { outline: 2px solid var(--fg); outline-offset: 1px; }
    .legend { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 12px; font-size: 12px; color: var(--muted); }
    .legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; background: var(--surface-2); }
    .adh { padding: 6px 16px 10px; }
    .adh-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
    .adh-row:first-child { border-top: 0; }
    .adh-row .pill { width: 32px; height: 32px; grid-row: span 2; }
    .adh-row .pill svg { width: 18px; height: 18px; }
    .adh-row b { font-size: 15px; font-weight: 500; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .adh-row em { font-style: normal; font-family: var(--font-round); font-weight: 600; grid-row: span 2; }
    .adh-bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
    .adh-bar div { height: 100%; width: 100%; background: var(--accent); border-radius: 3px; transform-origin: left; }
    .adh-bar div.low { background: var(--warn); }
    .detail { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .detail h3 { margin: 0; font-size: 16px; font-weight: 600; }
    .detail ul { margin: 0; padding: 0; list-style: none; }
    .detail li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
    .detail li:first-child { border-top: 0; }
    .detail li .pill { width: 30px; height: 30px; }
    .detail li .pill svg { width: 17px; height: 17px; }
    .detail li .nm { min-width: 0; }
    .detail li .tm { margin-left: auto; color: var(--muted); font-size: 14px; font-family: var(--font-round); white-space: nowrap; }

    /* ---------- sheets / toast ---------- */
    .backdrop { position: absolute; inset: 0; background: rgba(14, 18, 26, .4); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .backdrop.open { opacity: 1; pointer-events: auto; }
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 88%; overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border-radius: 28px 28px 0 0; padding: 8px 18px calc(22px + var(--safe-bottom)); transform: translateY(calc(100% + 40px)); visibility: hidden; transition: transform .2s var(--ease-in), visibility 0s .2s; box-sizing: border-box; }
    .sheet.open { transform: translateY(0); visibility: visible; transition: transform .3s var(--ease-out), visibility 0s; }
    .grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 10px; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .sheet-head h2 { margin: 0; font-size: 20px; font-weight: 600; font-family: var(--font-round); }
    .form { display: flex; flex-direction: column; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field > label, .field > .lbl { font-size: 14px; font-weight: 600; color: var(--muted); }
    .field input[type="text"], .field input[type="number"], .field input[type="url"] { font-size: 16px; min-height: 50px; padding: 0 14px; border: 1.5px solid transparent; border-radius: 14px; background: var(--surface-2); box-sizing: border-box; width: 100%; }
    .field input:focus { border-color: var(--accent); outline: none; }
    .field-error { font-size: 14px; color: var(--danger); margin: 0; }
    .req { color: var(--danger); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .sheet-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 4px; }
    .settings-block { display: flex; flex-direction: column; gap: 10px; padding: 14px; background: var(--surface-2); border-radius: 18px; }
    .settings-block h3 { margin: 0; font-size: 15px; }
    .settings-block .stepper { background: var(--surface); }
    .settings-block .field input { background: var(--surface); }
    .status-line { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; margin: 0; }
    .dose-big { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 6px 0; }
    .dose-big button { width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--surface-2); font-size: 28px; }
    .dose-big output { font-family: var(--font-round); font-size: 60px; font-weight: 600; min-width: 80px; text-align: center; line-height: 1; }
    .dose-big small { font-size: 16px; color: var(--muted); }
    .dose-meta { text-align: center; font-size: 14px; color: var(--muted); margin: 0; }
    .check-opt { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; }
    .check-opt input { width: 22px; height: 22px; accent-color: var(--accent); }
    .shop { display: flex; flex-direction: column; gap: 12px; }
    .shop h3 { margin: 6px 0 0; font-size: 15px; color: var(--muted); font-weight: 600; }
    .shop-item { background: var(--surface-2); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .shop-top { display: flex; align-items: center; gap: 10px; }
    .shop-top .txt { flex: 1; min-width: 0; }
    .shop-top b { display: block; font-size: 16px; font-weight: 600; }
    .shop-top .sub { font-size: 13px; color: var(--muted); }
    .shop-top .late { color: var(--danger); font-weight: 600; }
    .shop-item .btn { background: var(--surface); }
    .shop-item .btn.buy { background: var(--buy); }
    .toast { position: absolute; left: 16px; right: 16px; bottom: calc(84px + var(--safe-bottom)); z-index: 30; background: var(--fg); color: var(--bg); padding: 12px 8px 12px 16px; border-radius: 16px; font-size: 15px; font-weight: 500; opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s var(--ease-out); pointer-events: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: var(--shadow-lift); min-height: 24px; }
    .toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .toast.error { background: var(--danger); color: #fff; }
    .toast button { flex: none; min-height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: var(--accent-soft); font-weight: 700; font-size: 15px; }
    .app:has(.sheet.open) .toast { top: calc(16px + var(--safe-top)); bottom: auto; }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <div class="app" id="app">
    <main class="scroller" id="scroller">
      <section class="screen" id="screen-checkin"></section>
      <section class="screen" id="screen-inventory" hidden></section>
      <section class="screen" id="screen-reminder" hidden></section>
      <section class="screen" id="screen-history" hidden></section>
    </main>

    <nav class="tabbar" role="tablist" aria-label="主要分頁">
      <button class="tab" role="tab" data-tab="checkin" aria-selected="true">
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.8"/></svg>今天
      </button>
      <button class="tab" role="tab" data-tab="inventory" aria-selected="false">
        <svg class="i" viewBox="0 0 24 24"><path d="M3 7.5l9-4.5 9 4.5v9l-9 4.5-9-4.5z"/><path d="M3 7.5l9 4.5 9-4.5M12 12v9"/></svg>庫存<span class="badge" id="invBadge" hidden></span>
      </button>
      <button class="tab" role="tab" data-tab="reminder" aria-selected="false">
        <svg class="i" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>提醒
      </button>
      <button class="tab" role="tab" data-tab="history" aria-selected="false">
        <svg class="i" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>紀錄
      </button>
    </nav>

    <button class="fab" id="fab" aria-label="新增保健品" hidden><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <div class="backdrop" id="backdrop"></div>

    <div class="sheet" id="sheet-add" role="dialog" aria-modal="true" aria-labelledby="addTitle">
      <div class="grabber"></div>
      <div class="sheet-head"><h2 id="addTitle">新增保健品</h2><button class="icon-btn" data-close aria-label="關閉"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <form class="form" id="addForm" novalidate>
        <div class="field"><label for="f-name">品名 <span class="req" aria-hidden="true">*</span></label><input type="text" id="f-name" placeholder="例如：維他命 D3 5000 IU" aria-required="true" aria-describedby="f-name-err" autocomplete="off"><p class="field-error" id="f-name-err" role="alert" hidden>請輸入品名</p></div>
        <div class="field"><span class="lbl">劑型（決定圖示）</span><div class="choice three" id="formPick"></div></div>
        <div class="grid2">
          <div class="field"><label for="f-cap">一罐幾顆</label><input type="number" id="f-cap" inputmode="numeric" value="60" min="1"></div>
          <div class="field"><label for="f-daily">每次吃幾顆</label><input type="number" id="f-daily" inputmode="numeric" value="1" min="1"></div>
          <div class="field"><label for="f-bottles">未拆整罐</label><input type="number" id="f-bottles" inputmode="numeric" value="1" min="0"></div>
          <div class="field"><label for="f-loose">開封散裝</label><input type="number" id="f-loose" inputmode="numeric" value="0" min="0"></div>
        </div>
        <div class="field"><span class="lbl">服用時段</span><div class="choice" id="slotPick"></div></div>
        <div class="field"><label for="f-notes">小備註</label><input type="text" id="f-notes" placeholder="例如：隨油脂餐吸收佳"></div>
        <div class="field"><label for="f-url">購買連結</label><input type="url" id="f-url" placeholder="https://" inputmode="url"></div>
        <div class="sheet-actions"><button type="button" class="btn" data-close>取消</button><button type="submit" class="btn primary">加入</button></div>
      </form>
    </div>

    <div class="sheet" id="sheet-dose" role="dialog" aria-modal="true" aria-labelledby="doseTitle">
      <div class="grabber"></div>
      <div class="sheet-head"><h2 id="doseTitle">這次吃幾顆</h2><button class="icon-btn" data-close aria-label="關閉"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="form">
        <div class="dose-big">
          <button type="button" id="doseMinus" aria-label="少一顆">−</button>
          <output id="doseVal" aria-live="polite">1</output><small>顆</small>
          <button type="button" id="dosePlus" aria-label="多一顆">＋</button>
        </div>
        <p class="dose-meta" id="doseMeta"></p>
        <label class="check-opt"><input type="checkbox" id="doseDefault">以後每次都吃這個份量</label>
        <div class="sheet-actions"><button type="button" class="btn" data-close>取消</button><button type="button" class="btn primary" id="doseConfirm">打卡</button></div>
      </div>
    </div>

    <div class="sheet" id="sheet-shop" role="dialog" aria-modal="true" aria-labelledby="shopTitle">
      <div class="grabber"></div>
      <div class="sheet-head"><h2 id="shopTitle">購物清單</h2><button class="icon-btn" data-close aria-label="關閉"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="shop" id="shopBody"></div>
    </div>

    <div class="sheet" id="sheet-settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="grabber"></div>
      <div class="sheet-head"><h2 id="settingsTitle">設定</h2><button class="icon-btn" data-close aria-label="關閉"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="form">
        <div class="settings-block">
          <h3>Google 試算表同步</h3>
          <p class="status-line" id="cloudStatusLine"></p>
          <div class="field"><label for="cloud-api-url">Apps Script 網址</label><input type="url" id="cloud-api-url" placeholder="https://script.google.com/macros/s/…/exec" inputmode="url" autocomplete="off"></div>
          <div class="sheet-actions"><button type="button" class="btn ghost-danger" id="cloudClear">清除</button><button type="button" class="btn primary" id="cloudSave">儲存並同步</button></div>
        </div>
        <div class="settings-block">
          <div class="row">
            <label for="leadDays">寄送天數<small>下單到收貨大約幾天，用來算最晚下單日（只存在這台裝置）</small></label>
            <div class="stepper">
              <button type="button" data-lead="-1" aria-label="寄送天數減一">−</button>
              <input type="number" inputmode="numeric" id="leadDays" min="0">
              <button type="button" data-lead="1" aria-label="寄送天數加一">＋</button>
            </div>
          </div>
        </div>
        <div class="settings-block">
          <h3>重設品項</h3>
          <p class="note-line">把品項換回內建的 11 款預設資料，打卡紀錄不受影響。</p>
          <button type="button" class="btn ghost-danger" id="resetBtn">重設為預設品項</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script>
    const DEFAULT_DATA = [
      { id: 1, name: "NOW Foods L-OptiZinc (鋅)", capacity: 100, bottles: 2, loose: 5, purchased: 0, daily: 1, slot: 'lunch', notes: '隨餐服用，避免空腹刺激胃部', url: "https://www.iherb.com/pr/now-foods-l-optizinc-100-veg-capsules/738" },
      { id: 2, name: "Life Extension 生物活性完整 B 群", capacity: 60, bottles: 1, loose: 10, purchased: 0, daily: 2, slot: 'morning', notes: '早/午餐後隨餐，提供日間活力', url: "https://www.iherb.com/pr/life-extension-bioactive-complete-b-complex-60-vegetarian-capsules/67051" },
      { id: 3, name: "Force Factor 基礎黑瑪卡", capacity: 90, bottles: 0, loose: 0, purchased: 4, daily: 2, slot: 'morning', notes: '早餐後隨水吞服，補充精力', url: "https://www.iherb.com/pr/force-factor-fundamentals-black-maca-90-capsules/128405" },
      { id: 4, name: "Nutricost KSM-66 南非醉茄", capacity: 60, bottles: 2, loose: 11, purchased: 0, daily: 1, slot: 'bedtime', notes: '晚餐後或睡前放鬆時服用', url: "https://www.iherb.com/pr/nutricost-ksm-66-ashwagandha-root-extract-60-capsules/139433" },
      { id: 5, name: "Life Extension 水溶性南瓜籽萃取", capacity: 60, bottles: 3, loose: 0, purchased: 0, daily: 1, slot: 'dinner', notes: '晚餐隨餐服用', url: "https://www.iherb.com/pr/life-extension-water-soluble-pumpkin-seed-extract-60-vegetarian-capsules-262-mg-per-capsule/13174" },
      { id: 6, name: "Sports Research 阿拉斯加野生魚油", capacity: 90, bottles: 1, loose: 0, purchased: 0, daily: 1, slot: 'lunch', notes: '隨含健康油脂正餐服用吸收佳', url: "https://www.iherb.com/pr/sports-research-alaskan-omega-3-fish-oil-90-softgels/90284" },
      { id: 7, name: "NOW Foods 左旋精胺酸 1000mg", capacity: 120, bottles: 0, loose: 90, purchased: 0, daily: 2, slot: 'morning', notes: '早晨空腹或運動前半小時服用', url: "https://www.iherb.com/pr/now-foods-l-arginine-1-000-mg-120-tablets/411" },
      { id: 8, name: "Swanson 茄紅素 20mg", capacity: 60, bottles: 3, loose: 0, purchased: 0, daily: 1, slot: 'dinner', notes: '脂溶性成分，晚間正餐後服用佳', url: "https://www.iherb.com/pr/swanson-vitamins-lycopene-20-mg-60-softgels/116298" },
      { id: 9, name: "Doctor's Best 葉黃素 (Lutemax 2020)", capacity: 180, bottles: 0, loose: 140, purchased: 0, daily: 1, slot: 'morning', notes: '早晨隨餐服用，維持晶亮', url: "https://www.iherb.com/pr/doctor-s-best-lutein-lutemax-2020-20-mg-180-softgels/58903" },
      { id: 10, name: "CGN 薑黃素 C3 Complex", capacity: 120, bottles: 0, loose: 35, purchased: 0, daily: 1, slot: 'lunch', notes: '含黑胡椒鹼，隨午餐服用佳', url: "https://www.iherb.com/pr/california-gold-nutrition-curcumin-c3-complex-with-bioperine-120-veggie-capsules/60047" },
      { id: 11, name: "Piping Rock 豔紫鉚 (紅高顆) 420mg", capacity: 90, bottles: 0, loose: 16, purchased: 0, daily: 1, slot: 'lunch', notes: '隨餐服用，傳統草藥滋補強身', url: "https://www.pipingrock.com/zh-tw/products/butea-superba-420-mg-90-quick-release-capsules-12060" }
    ];

    const STORAGE_KEY_ITEMS = 'supplement_tracker_inventory_v8';
    const STORAGE_KEY_CHECKINS = 'supplement_tracker_checkins_v8';
    const STORAGE_KEY_REMINDERS = 'supplement_tracker_reminders_v8';
    const STORAGE_KEY_CLOUD_URL = 'supplement_tracker_cloud_url';
    // 本裝置已成功從哪個雲端網址拉取過資料；拉取成功前不上傳，避免預設資料覆蓋雲端
    const STORAGE_KEY_CLOUD_VERIFIED = 'supplement_tracker_cloud_verified_url';
    // 本機資料是基於雲端第幾版；上傳時附上，雲端已被其他裝置更新就會被拒絕，避免互相覆蓋
    const STORAGE_KEY_CLOUD_REVISION = 'supplement_tracker_cloud_revision';
    // 本機有尚未成功上傳的修改
    const STORAGE_KEY_CLOUD_DIRTY = 'supplement_tracker_cloud_dirty';

    let items = [];
    let currentFilter = 'all';
    let checkinRecords = {};
    let reminderTimes = { morning: "08:00", lunch: "12:30", dinner: "18:30", bedtime: "22:00" };
    let cloudApiUrl = "";
    let isSyncing = false;
    let syncDebounceTimer = null;
    let localChangeSeq = 0;      // 每次本機修改 +1，用來判斷同步期間有沒有新修改
    let pushInFlight = false;
    let pushQueued = false;
    let lastRefreshAt = 0;

    function getTodayKey() {
      const d = new Date();
      const yr = d.getFullYear();
      const mo = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${yr}-${mo}-${day}`;
    }

    function initData() {
      // 讀取 Google Apps Script 網址
      cloudApiUrl = localStorage.getItem(STORAGE_KEY_CLOUD_URL) || "";
      // 舊版已連線的裝置：視為已驗證，維持原本的同步行為
      if (cloudApiUrl && !localStorage.getItem(STORAGE_KEY_CLOUD_VERIFIED)) {
        localStorage.setItem(STORAGE_KEY_CLOUD_VERIFIED, cloudApiUrl);
      }
      updateCloudStatusUI();

      // 先從本地快取讀取
      const savedItems = localStorage.getItem(STORAGE_KEY_ITEMS);
      if (savedItems) {
        try { items = JSON.parse(savedItems); } catch (e) { items = JSON.parse(JSON.stringify(DEFAULT_DATA)); }
      } else {
        items = JSON.parse(JSON.stringify(DEFAULT_DATA));
      }

      if (items && items.length < DEFAULT_DATA.length) {
        DEFAULT_DATA.forEach(defItem => {
          if (!items.some(it => it.id === defItem.id)) {
            items.push(JSON.parse(JSON.stringify(defItem)));
          }
        });
        saveDataLocal();
      }

      const savedCheckins = localStorage.getItem(STORAGE_KEY_CHECKINS);
      if (savedCheckins) {
        try { checkinRecords = JSON.parse(savedCheckins); } catch (e) {}
      }

      const savedReminders = localStorage.getItem(STORAGE_KEY_REMINDERS);
      if (savedReminders) {
        try { reminderTimes = Object.assign(reminderTimes, JSON.parse(savedReminders)); } catch (e) {}
      }

      const today = getTodayKey();
      if (!checkinRecords[today]) {
        checkinRecords[today] = {};
      }

      // 如果有設定雲端 API：有未上傳的修改就先上傳，否則背景拉取最新資料
      if (cloudApiUrl) {
        refreshFromCloud();
      }
    }

    // 從背景切回 App 時檢查雲端是否有其他裝置的更新
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && Date.now() - lastRefreshAt > 30000) {
        refreshFromCloud();
      }
    });

    function saveDataLocal() {
      localStorage.setItem(STORAGE_KEY_ITEMS, JSON.stringify(items));
    }

    function saveCheckinsLocal() {
      localStorage.setItem(STORAGE_KEY_CHECKINS, JSON.stringify(checkinRecords));
    }

    function getCloudRevision() {
      const v = localStorage.getItem(STORAGE_KEY_CLOUD_REVISION);
      return v === null ? null : Number(v);
    }

    function setCloudRevision(rev) {
      if (typeof rev === 'number' && !isNaN(rev)) {
        localStorage.setItem(STORAGE_KEY_CLOUD_REVISION, String(rev));
      }
    }

    function isCloudDirty() {
      return localStorage.getItem(STORAGE_KEY_CLOUD_DIRTY) === '1';
    }

    function setCloudDirty(dirty) {
      if (dirty) localStorage.setItem(STORAGE_KEY_CLOUD_DIRTY, '1');
      else localStorage.removeItem(STORAGE_KEY_CLOUD_DIRTY);
    }

    // 有未上傳的修改就上傳（衝突時會自動改為載入雲端），否則拉取最新資料
    function refreshFromCloud(isSilent = true) {
      if (!cloudApiUrl) {
        if (!isSilent) toggleCloudModal();
        return;
      }
      if (pushInFlight) return;
      lastRefreshAt = Date.now();
      if (isCloudDirty() && isCloudVerified()) {
        clearTimeout(syncDebounceTimer);  // 立即上傳，取消排程中的重複上傳
        return pushToCloud();
      }
      return syncWithCloud(isSilent);
    }

    // 防抖自動同步至雲端
    function triggerCloudSync() {
      saveDataLocal();
      saveCheckinsLocal();
      localChangeSeq++;
      if (!cloudApiUrl) return;
      setCloudDirty(true);

      clearTimeout(syncDebounceTimer);
      syncDebounceTimer = setTimeout(() => {
        pushToCloud();
      }, 1200);
    }

    function isCloudVerified() {
      return !!cloudApiUrl && localStorage.getItem(STORAGE_KEY_CLOUD_VERIFIED) === cloudApiUrl;
    }

    // 向 Google 試算表推播儲存；附上本機所依據的雲端版本號，雲端較新時會被拒絕
    async function pushToCloud() {
      if (!cloudApiUrl) return;
      if (!isCloudVerified()) {
        updateCloudIndicator('offline', '尚未讀取雲端，暫不上傳');
        return;
      }
      // 同一台裝置的上傳一次只送一筆，避免自己跟自己的版本號衝突
      if (pushInFlight) {
        pushQueued = true;
        return;
      }
      pushInFlight = true;
      const seqAtSend = localChangeSeq;
      setSyncLoading(true);
      try {
        const payload = {
          action: "saveAll",
          baseRevision: getCloudRevision(),
          data: {
            items: items,
            checkins: checkinRecords,
            reminders: reminderTimes
          }
        };

        // 使用 text/plain 避免 CORS preflight OPTIONS 請求
        const res = await fetch(cloudApiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.status === 'success') {
          setCloudRevision(result.revision);
          if (seqAtSend === localChangeSeq) setCloudDirty(false);
          updateCloudIndicator('online', '雲端已同步');
        } else if (result.status === 'conflict') {
          // 其他裝置已更新雲端：以雲端為準，剛才的修改捨棄並提示
          setCloudDirty(false);
          pushQueued = false;
          await syncWithCloud(true, true);
          showToast('其他裝置剛更新過資料，已載入最新版本，剛才的操作請再做一次', true);
        } else {
          throw new Error(result.message || '未知錯誤');
        }
      } catch (err) {
        updateCloudIndicator('offline', '上傳失敗，修改暫存在本機');
      } finally {
        pushInFlight = false;
        setSyncLoading(false);
        if (pushQueued) {
          pushQueued = false;
          pushToCloud();
        }
      }
    }

    // 從 Google 試算表拉取資料，回傳 'hasData' | 'empty' | 'error'
    // force：衝突時強制以雲端為準；否則拉取期間本機有新修改就不覆蓋，改由上傳處理
    async function syncWithCloud(isSilent = false, force = false) {
      if (!cloudApiUrl) {
        if (!isSilent) toggleCloudModal();
        return;
      }

      setSyncLoading(true);
      const seqAtStart = localChangeSeq;
      try {
        const fetchUrl = `${cloudApiUrl}?action=getData&_t=${Date.now()}`;
        const res = await fetch(fetchUrl);
        const result = await res.json();

        if (result.status === "success" && result.data && !force && localChangeSeq !== seqAtStart) {
          // 拉取期間使用者又改了資料：保留本機修改，交給上傳（雲端較新會被拒絕並提示）
          return 'error';
        }

        if (result.status === "success" && result.data) {
          setCloudRevision(result.data.revision);
          undoSnap = null;  // 資料被雲端取代後，舊的復原快照不再適用
          const cloudHasItems = Array.isArray(result.data.items) && result.data.items.length > 0;
          const cloudHasCheckins = !!result.data.checkins &&
            Object.values(result.data.checkins).some(day => day && Object.keys(day).length > 0);

          // force（衝突後）時雲端就是準，即使是空的也照單全收，不留下被拒絕的本機修改
          if (cloudHasItems || (force && Array.isArray(result.data.items))) {
            items = result.data.items;
            saveDataLocal();
          }
          if (cloudHasCheckins || (force && result.data.checkins)) {
            checkinRecords = result.data.checkins;
            const today = getTodayKey();
            if (!checkinRecords[today]) checkinRecords[today] = {};
            saveCheckinsLocal();
          }
          if (result.data.reminders) {
            reminderTimes = Object.assign(reminderTimes, result.data.reminders);
            localStorage.setItem(STORAGE_KEY_REMINDERS, JSON.stringify(reminderTimes));
          }

          updateCloudIndicator('online', '已同步 Google 試算表');
          localStorage.setItem(STORAGE_KEY_CLOUD_VERIFIED, cloudApiUrl);
          if (!isSilent) showToast('已成功從 Google 試算表拉取最新數據！');
          renderAll();
          if (cloudHasItems || cloudHasCheckins || force) {
            setCloudDirty(false);
            return 'hasData';
          }
          return 'empty';
        } else {
          throw new Error(result.message || '未知錯誤');
        }
      } catch (err) {
        updateCloudIndicator('offline', '讀取失敗 (使用本機暫存)');
        if (!isSilent) showToast('同步失敗，目前顯示本機暫存資料', true);
        return 'error';
      } finally {
        setSyncLoading(false);
      }
    }


    // =====================================================================
    //  以下為介面層（v4 手機版）
    // =====================================================================
    const SLOTS = {
      morning: { name: '晨間空腹' },
      lunch: { name: '午間隨餐' },
      dinner: { name: '晚間隨餐' },
      bedtime: { name: '睡前放鬆' }
    };
    const SLOT_ORDER = ['morning', 'lunch', 'dinner', 'bedtime'];
    const FORMS = { capsule: '膠囊', softgel: '軟膠囊', tablet: '錠劑' };
    const COLORS = ['blue', 'amber', 'violet', 'teal', 'orange', 'rose'];
    const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
    const STORAGE_KEY_LEAD_DAYS = 'supplement_tracker_lead_days';

    let tab = 'checkin';
    let viewDay = null;           // 今天頁正在看哪一天（null＝今天）
    let selectedDay = null;       // 紀錄頁選的日期（null＝今天）
    let openItem = null;
    let addSlot = 'lunch', addForm = 'capsule';
    let leadDays = 10;
    let pendingDelete = null, pendingDeleteTimer = null;
    let pendingReset = false, pendingResetTimer = null;
    let justChecked = null;
    let undoSnap = null;
    let cloudState = { status: 'none', text: '未設定雲端' };
    const shopQty = {};
    try { const v = parseInt(localStorage.getItem(STORAGE_KEY_LEAD_DAYS), 10); if (!isNaN(v)) leadDays = v; } catch (e) {}

    // ---------- helpers ----------
    const $ = s => document.querySelector(s);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const keyOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
    const startOfToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
    const nowHM = () => { const n = new Date(); return `${String(n.getHours()).padStart(2, '0')}:${String(n.getMinutes()).padStart(2, '0')}`; };
    const svgI = d => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
    const icon = {
      check: svgI('<path d="M6 12.5l4 4L18 8"/>'),
      ext: svgI('<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'),
      trash: svgI('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'),
      inbox: svgI('<path d="M4 13h4l2 3h4l2-3h4"/><path d="M4 13l2-8h12l2 8v6H4z"/>'),
      gear: svgI('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
      clock: svgI('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
      alert: svgI('<path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5h.01"/>'),
      ok: svgI('<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.8"/>'),
      bell: svgI('<path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>'),
      cart: svgI('<path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/>')
    };
    const FORM_SVG = {
      capsule: '<svg viewBox="0 0 24 24"><g transform="rotate(-40 12 12)"><rect x="3.5" y="8" width="17" height="8" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 8h4.5a4 4 0 0 1 0 8H12z" fill="currentColor"/></g></svg>',
      softgel: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="5.6" ry="8" fill="currentColor" transform="rotate(35 12 12)"/><ellipse cx="9.8" cy="9.4" rx="1.3" ry="2.6" fill="#fff" opacity=".55" transform="rotate(35 9.8 9.4)"/></svg>',
      tablet: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" fill="currentColor"/><path d="M7.2 12h9.6" stroke="#fff" stroke-width="1.6" opacity=".6"/></svg>'
    };

    // 舊資料沒有劑型欄位：依品名猜一個，使用者可在庫存頁改
    function inferForm(name) {
      if (/softgel|軟膠囊|魚油|fish oil|omega|葉黃素|lutein|茄紅素|lycopene|q10|維生素\s*[de]|vitamin\s*[de]/i.test(name || '')) return 'softgel';
      if (/tablet|錠/i.test(name || '')) return 'tablet';
      return 'capsule';
    }
    const formOf = it => FORMS[it.form] ? it.form : inferForm(it.name);
    function colorOf(it) {
      const s = String(it.id); let h = 0;
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
      return COLORS[h % COLORS.length];
    }
    const pill = it => `<i class="pill ${colorOf(it)}" aria-hidden="true">${FORM_SVG[formOf(it)]}</i>`;
    function shortName(name) {
      // 去掉品牌前綴；中文只出現在括號裡（例如「L-OptiZinc (鋅)」）時保留全名
      name = String(name || '');
      const i = name.search(/[一-鿿]/);
      if (i < 0) return name;
      const before = name.slice(0, i);
      if ((before.match(/\(/g) || []).length > (before.match(/\)/g) || []).length) return name;
      return name.slice(i);
    }
    const brandOf = name => { const s = shortName(name); return s === name ? '' : String(name).slice(0, name.length - s.length).trim(); };
    const findItem = id => items.find(it => String(it.id) === String(id));
    const slotOf = it => SLOTS[it.slot] ? it.slot : 'lunch';
    const doseOf = it => Number(it.daily) > 0 ? Number(it.daily) : 1;
    const dayDone = key => { const d = checkinRecords[key]; return d ? items.filter(it => d[it.id]).length : 0; };

    function stats(it) {
      const cap = Number(it.capacity) || 0;
      const cur = Math.max(0, Number(it.bottles) || 0) * cap + Math.max(0, Number(it.loose) || 0);
      const daily = doseOf(it);
      const days = Math.floor(cur / daily);
      const buyDays = Math.floor(Math.max(0, Number(it.purchased) || 0) * cap / daily);
      let status = 'ok', label = '充足';
      if (days <= 0) { status = 'empty'; label = '已斷貨'; }
      else if (days <= 14) { status = 'danger'; label = '即將斷貨'; }
      else if (days <= 30) { status = 'warn'; label = '建議下單'; }
      const t = startOfToday();
      const end = new Date(t); end.setDate(end.getDate() + days);
      const orderIn = days - leadDays;
      const ob = new Date(t); ob.setDate(ob.getDate() + Math.max(0, orderIn));
      return { cur, days, buyDays, status, label, end: `${end.getMonth() + 1}/${end.getDate()}`, orderIn, orderBy: `${ob.getMonth() + 1}/${ob.getDate()}` };
    }
    const suggestQty = it => Math.max(1, Math.ceil((90 * doseOf(it) - stats(it).cur) / (Number(it.capacity) || 1)));

    function applyPills(it, delta) {
      const cap = Number(it.capacity) > 0 ? Number(it.capacity) : 1;
      const total = Math.max(0, (Number(it.bottles) || 0) * cap + (Number(it.loose) || 0) + delta);
      it.bottles = Math.floor(total / cap);
      it.loose = total % cap;
    }

    function currentSlot() {
      const hm = nowHM(); let cur = 'morning';
      SLOT_ORDER.forEach(s => { if (hm >= (reminderTimes[s] || '99:99')) cur = s; });
      return cur;
    }

    // ---------- sync status (sync core 會呼叫這幾個函式) ----------
    function updateCloudIndicator(status, text) { cloudState = { status, text }; paintSync(); }
    function setSyncLoading(loading) { isSyncing = loading; paintSync(); }
    function updateCloudStatusUI() {
      const input = $('#cloud-api-url'); if (input) input.value = cloudApiUrl;
      if (cloudApiUrl) updateCloudIndicator('online', '雲端就緒');
      else updateCloudIndicator('none', '未設定雲端');
    }
    function paintSync() {
      const short = isSyncing ? '同步中' : cloudState.status === 'online' ? '已同步' : cloudState.status === 'offline' ? '未同步' : '未連線';
      document.querySelectorAll('.sync').forEach(el => {
        el.className = `sync ${isSyncing ? 'busy' : cloudState.status}`;
        el.innerHTML = `${isSyncing ? '<span class="spin" aria-hidden="true"></span>' : '<span class="dot" aria-hidden="true"></span>'}${short}`;
        el.setAttribute('aria-label', `同步狀態：${isSyncing ? '同步中' : cloudState.text}，點擊開啟設定`);
      });
      const line = $('#cloudStatusLine');
      if (line) line.textContent = `目前狀態：${isSyncing ? '同步中…' : cloudState.text}`;
    }
    function toggleCloudModal() {
      if ($('#sheet-settings').classList.contains('open')) closeSheets(); else openSettings();
    }
    function openSettings() {
      $('#cloud-api-url').value = cloudApiUrl;
      $('#leadDays').value = leadDays;
      pendingReset = false; paintReset();
      paintSync();
      openSheet('sheet-settings');
    }

    async function saveAndConnectCloud() {
      const url = $('#cloud-api-url').value.trim();
      if (!url) { showToast('請輸入 Google Apps Script 網址', true); return; }
      if (url === cloudApiUrl && isCloudVerified()) {
        closeSheets();
        return refreshFromCloud(false);
      }
      cloudApiUrl = url;
      localStorage.setItem(STORAGE_KEY_CLOUD_URL, cloudApiUrl);
      updateCloudStatusUI();
      closeSheets();
      showToast('已儲存，正在讀取雲端資料…');
      // 先拉後推：雲端已有資料就以雲端為準；只有雲端是空的才上傳本機資料
      const result = await syncWithCloud();
      if (result === 'empty') {
        await pushToCloud();
        showToast('雲端還沒有資料，已上傳本機資料');
      }
    }

    function clearCloudApi() {
      cloudApiUrl = "";
      localStorage.removeItem(STORAGE_KEY_CLOUD_URL);
      localStorage.removeItem(STORAGE_KEY_CLOUD_VERIFIED);
      localStorage.removeItem(STORAGE_KEY_CLOUD_REVISION);
      setCloudDirty(false);
      updateCloudStatusUI();
      closeSheets();
      showToast('已取消雲端同步，資料只存在這台裝置');
    }

    // ---------- page header ----------
    function head(eyebrow, title) {
      return `<header class="page-head">
        <div><small>${eyebrow}</small><h1>${title}</h1></div>
        <div class="head-actions">
          <button class="sync" data-settings></button>
          <button class="icon-btn" data-settings aria-label="設定">${icon.gear}</button>
        </div>
      </header>`;
    }

    function ring(frac, full) {
      const r = 12, c = 2 * Math.PI * r;
      if (full) return `<svg class="ring" viewBox="0 0 28 28" aria-hidden="true"><circle class="full" cx="14" cy="14" r="13"/><path class="tick" d="M9 14.5l3.2 3.2L19 11"/></svg>`;
      return `<svg class="ring" viewBox="0 0 28 28" aria-hidden="true"><circle class="bgc" cx="14" cy="14" r="${r}"/><circle class="fgc" cx="14" cy="14" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - Math.min(1, frac))}"/></svg>`;
    }

    // ---------- 今天 ----------
    function renderCheckinView() {
      const todayKey = getTodayKey();
      const vKey = viewDay || todayKey;
      const isToday = vKey === todayKey;
      const today = startOfToday();
      const monday = new Date(today); monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
      const week = Array.from({ length: 7 }, (_, i) => { const d = new Date(monday); d.setDate(monday.getDate() + i); return d; });
      const vd = fromKey(vKey);
      const day = checkinRecords[vKey] || {};
      const done = items.filter(it => day[it.id]).length;
      const cur = currentSlot();

      $('#screen-checkin').innerHTML = `
        ${head(isToday ? '今天' : `${vd.getMonth() + 1} 月 ${vd.getDate()} 日（${WEEK[vd.getDay()]}）`, isToday ? `${today.getMonth() + 1} 月 ${today.getDate()} 日` : '過去紀錄')}
        <div class="week" role="group" aria-label="這一週">
          ${week.map(d => {
            const k = keyOf(d), future = d > today, n = dayDone(k);
            return `<button class="wday ${k === vKey ? 'sel' : ''} ${future ? 'future' : ''}" ${future ? 'disabled' : `data-view="${k}"`} aria-label="${d.getMonth() + 1}月${d.getDate()}日，吃了 ${n} / ${items.length} 款" ${k === vKey ? 'aria-current="date"' : ''}>
              <span>${WEEK[d.getDay()]}</span>${future || !items.length ? ring(0) : ring(n / items.length, n >= items.length)}<b>${d.getDate()}</b>
            </button>`;
          }).join('')}
        </div>
        ${items.length ? `
        <div class="card day-sum">
          <p>${isToday ? '今天進度' : '那天吃了'}<span>${isToday ? '點卡片打卡，點「顆」改這次份量' : '過去的日子目前只能查看'}</span></p>
          <div class="big">${done}<small> / ${items.length}</small></div>
        </div>
        ${isToday && done === items.length ? `<div class="all-done">${icon.check}今天的都吃完了</div>` : ''}
        ${isToday && done > 0 && done < items.length ? '' : ''}
        ${SLOT_ORDER.map(slot => {
          const list = items.filter(it => slotOf(it) === slot);
          if (!list.length) return '';
          const slotDone = list.filter(it => day[it.id]).length;
          return `<div class="slot-label"><h2>${SLOTS[slot].name}</h2><span class="t">${esc(reminderTimes[slot] || '')}</span>${isToday && slot === cur ? '<span class="now-tag">現在</span>' : ''}<span class="n">${slotDone}/${list.length}</span></div>
            <div class="dose-list" id="slot-${slot}">
            ${list.map(it => {
              const rec = day[it.id];
              const qty = rec ? (rec.daily || doseOf(it)) : doseOf(it);
              const dis = isToday ? '' : 'disabled';
              return `<div class="card dose-card ${rec ? 'done' : ''} ${justChecked === String(it.id) ? 'pop' : ''}">
                <button class="dose-main" ${dis} data-check="${esc(it.id)}" aria-pressed="${!!rec}">
                  ${pill(it)}
                  <span class="txt"><b>${esc(shortName(it.name))}</b><span class="sub">${rec ? `${esc(rec.time || '')} 已吃` : esc(it.notes || '')}</span></span>
                </button>
                <button class="qty" ${dis} data-dose="${esc(it.id)}" aria-label="這次吃 ${qty} 顆，點擊調整"><b>${qty}</b>顆</button>
                <button class="check" ${dis} data-check="${esc(it.id)}" aria-label="${rec ? '取消打卡' : '打卡'}：${esc(shortName(it.name))}"><i>${icon.check}</i></button>
              </div>`;
            }).join('')}
            </div>
            ${isToday && slotDone < list.length ? `<button class="btn soft small slot-all" data-slot-all="${slot}">${SLOTS[slot].name}全部打卡</button>` : ''}`;
        }).join('')}` : `<div class="card empty">還沒有任何保健品，到「庫存」按右下角 ＋ 新增</div>`}`;
    }

    function doToggle(id) {
      const key = getTodayKey();
      if (!checkinRecords[key]) checkinRecords[key] = {};
      const it = findItem(id); if (!it) return null;

            <div class="shop-top">${pill(it)}<div class="txt"><b>${esc(shortName(it.name))}</b><span class="sub">${esc(it.purchased)} 罐</span></div></div>
            <button class="btn buy" data-receive="${esc(it.id)}">${icon.inbox}到貨了，轉入庫存</button>
          </div>`).join('') : ''}`;

    // ---------- 提醒 ----------
    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
    const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    function renderReminderView() {
      const perm = typeof Notification === 'undefined' ? 'unsupported' : Notification.permission;
      const permText = { granted: '已開啟，時間到會跳出通知', denied: '已被封鎖，請到系統設定開啟', default: '時間到跳出通知', unsupported: '這個瀏覽器不支援通知，只會播放提示音' }[perm];
      $('#screen-reminder').innerHTML = `
        ${head('每天', '提醒')}
        <div class="card switch-card">
          <div style="flex:1"><b>推播提醒</b><span>${permText}</span></div>
          <button class="switch" role="switch" data-notify aria-checked="${perm === 'granted'}" aria-label="推播提醒"></button>
        </div>
        ${isIOS && !isStandalone() ? '<p class="tip-box">iPhone 要先用 Safari「分享 → 加入主畫面」，從主畫面打開才收得到通知。</p>' : ''}
        <p class="note-line">提醒只會在 App 開著（或在背景剛切出去）時響；完全關掉 App 不會通知。</p>
        ${SLOT_ORDER.map(slot => {
          const list = items.filter(it => slotOf(it) === slot);
          return `<div class="card rem">
            <div class="rem-top">${icon.clock}<input type="time" value="${esc(reminderTimes[slot] || '')}" data-time="${slot}" aria-label="${SLOTS[slot].name}提醒時間"><span class="when">${SLOTS[slot].name} · 每天</span></div>
            ${list.length ? `<div class="rem-items">${list.map(it => `<span class="chip">${pill(it)}${esc(shortName(it.name).replace(/\s*\(.*$/, ''))}</span>`).join('')}</div>` : ''}
          </div>`;
        }).join('')}
        <button class="btn" data-test-sound>${icon.bell}試聽提醒音</button>
        ${items.length ? `<div class="label"><h2>最佳吸收時段</h2></div>
        <div class="card tips">
          ${SLOT_ORDER.flatMap(slot => items.filter(it => slotOf(it) === slot)).map(it => `
            <div class="tip">${pill(it)}<div class="txt"><b>${esc(shortName(it.name))}</b><p>${SLOTS[slotOf(it)].name} · ${doseOf(it)} 顆${it.notes ? ' · ' + esc(it.notes) : ''}</p></div></div>`).join('')}
        </div>` : ''}`;
    }

    function playChime() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
      } catch (e) {}
    }

    // iOS 主畫面 App 只能透過 service worker 顯示通知
    function notify(title, body) {
      if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistration().then(reg => {
          if (reg) reg.showNotification(title, { body, icon: 'icons/icon-192.png', tag: 'supplement-reminder' });
          else { try { new Notification(title, { body }); } catch (e) {} }
        });
      } else { try { new Notification(title, { body }); } catch (e) {} }
    }

    function requestNotificationPermission() {
      if (typeof Notification === 'undefined') { showToast('這個瀏覽器不支援通知，時間到會播放提示音'); return; }
      if (Notification.permission === 'granted') { showToast('要關閉通知，請到系統設定調整'); return; }
      if (Notification.permission === 'denied') { showToast('通知已被封鎖，請到系統設定開啟', true); return; }
      Notification.requestPermission().then(p => {
        renderReminderView();
        if (p === 'granted') { showToast('已開啟通知'); notify('保健品提醒已開啟', '時間到會提醒你吃保健品'); }
      });
    }

    const firedToday = {};
    function checkReminders() {
      const key = getTodayKey(), hm = nowHM();
      SLOT_ORDER.forEach(slot => {
        if (reminderTimes[slot] === hm && firedToday[slot] !== key) {
          firedToday[slot] = key;
          triggerSlotReminder(slot);
        }
      });
    }
    setInterval(checkReminders, 15000);

    function triggerSlotReminder(slot) {
      playChime();
      const names = items.filter(it => slotOf(it) === slot && !(checkinRecords[getTodayKey()] || {})[it.id]).map(it => shortName(it.name));
      if (!names.length) return;
      const title = `${SLOTS[slot].name}時間到了`;
      showToast(`${title}：${names.join('、')}`);
      notify(title, `記得吃：${names.join('、')}`);
    }

    // ---------- 紀錄 ----------
    function level(key) {
      const n = dayDone(key), f = items.length ? n / items.length : 0;
      return n === 0 ? '' : f >= 1 ? 'l4' : f >= .8 ? 'l3' : f >= .5 ? 'l2' : 'l1';
    }
    function renderHistoryView() {
      const today = startOfToday();
      const todayKey = keyOf(today);
      const selKey = selectedDay || todayKey;
      let streak = 0;
      for (let i = 0; i < 1000; i++) {
        const d = new Date(today); d.setDate(d.getDate() - i); const k = keyOf(d);
        if (i === 0 && level(k) !== 'l4') continue;
        if (level(k) === 'l4') streak++; else break;
      }
      const y = today.getFullYear(), m = today.getMonth();
      let taken = 0, expected = 0;
      for (let dd = 1; dd <= today.getDate(); dd++) { taken += dayDone(keyOf(new Date(y, m, dd))); expected += items.length; }
      const pills = Object.values(checkinRecords).reduce((sum, day) => sum + Object.values(day || {}).reduce((a, r) => a + (Number(r && r.daily) || 1), 0), 0);

      // 各品項服用率：最近 30 天（不含今天），從有紀錄的第一天起算
      const recordKeys = Object.keys(checkinRecords).filter(k => Object.keys(checkinRecords[k] || {}).length).sort();
      const firstKey = recordKeys[0];
      const span = [];
      for (let i = 1; i <= 30; i++) { const d = new Date(today); d.setDate(d.getDate() - i); const k = keyOf(d); if (firstKey && k >= firstKey) span.push(k); }
      const adh = items.map(it => ({ it, pct: span.length ? Math.round(span.filter(k => (checkinRecords[k] || {})[it.id]).length / span.length * 100) : 0 })).sort((a, b) => a.pct - b.pct);

      const lead = (new Date(y, m, 1).getDay() + 6) % 7;
      const dim = new Date(y, m + 1, 0).getDate();
      const cells = [];
      for (let i = 0; i < lead; i++) cells.push('<span></span>');
      for (let dd = 1; dd <= dim; dd++) {
        const d = new Date(y, m, dd), k = keyOf(d), future = d > today;
        cells.push(`<button class="day ${future ? 'future' : level(k)} ${k === selKey ? 'sel' : ''}" ${future ? 'disabled' : `data-day="${k}"`} aria-label="${m + 1}月${dd}日，吃了 ${dayDone(k)} / ${items.length} 款">${dd}</button>`);
      }
      const sel = checkinRecords[selKey] || {};
      const sd = fromKey(selKey);
      const selIds = Object.keys(sel);

      $('#screen-history').innerHTML = `
        ${head(`${y} 年`, `${m + 1} 月紀錄`)}
        <div class="card rate">
          <div><b>${expected ? Math.round(taken / expected * 100) : 0}%</b><p>本月服用率<span>應吃 ${expected} 次，吃了 ${taken} 次</span></p></div>
          <div class="rate-side"><div><b class="r">${streak}</b><span>連續全勤</span></div><div><b class="r">${pills.toLocaleString()}</b><span>累計顆數</span></div></div>
        </div>
        <div class="card cal">
          <div class="cal-head"><b>每日完成度</b></div>
          <div class="cal-grid">${['一', '二', '三', '四', '五', '六', '日'].map(w => `<span class="dow">${w}</span>`).join('')}${cells.join('')}</div>
          <div class="legend">沒吃 <i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> 全勤</div>
        </div>
        <div class="card detail">
          <h3>${sd.getMonth() + 1}/${sd.getDate()}（${WEEK[sd.getDay()]}）吃了 ${dayDone(selKey)} / ${items.length} 款</h3>
          ${selIds.length ? `<ul>${selIds.map(id => { const it = findItem(id); const r = sel[id] || {}; return `<li>${it ? pill(it) : ''}<span class="nm">${it ? esc(shortName(it.name)) : '（已刪除的品項）'}</span><span class="tm">${esc(r.time || '')} · ${Number(r.daily) || 1} 顆</span></li>`; }).join('')}</ul>` : '<p class="note-line">這天沒有打卡紀錄</p>'}
        </div>
        ${items.length ? `<div class="label"><h2>各品項服用率</h2><span>${span.length ? `最近 ${span.length} 天` : '累積幾天紀錄後會出現'}</span></div>
        ${span.length ? `<div class="card adh">
          ${adh.map(({ it, pct }) => `<div class="adh-row">${pill(it)}<b>${esc(shortName(it.name))}</b><em>${pct}%</em><div class="adh-bar"><div class="${pct < 80 ? 'low' : ''}" style="transform:scaleX(${pct / 100})"></div></div></div>`).join('')}
        </div>` : ''}` : ''}`;
    }

    // ---------- sheets / toast / undo ----------
    function openSheet(id) { $('#backdrop').classList.add('open'); $('#' + id).classList.add('open'); }
    function closeSheets() { $('#backdrop').classList.remove('open'); document.querySelectorAll('.sheet.open').forEach(s => s.classList.remove('open')); }

    let toastTimer;
    function showToast(msg, isError = false, undoable = false) {
      const el = $('#toast');
      el.innerHTML = `<span>${esc(msg)}</span>${undoable ? '<button type="button" data-undo>復原</button>' : ''}`;
      el.classList.toggle('error', !!isError);
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), undoable ? 5000 : 4000);
    }

    // 復原：會改資料的操作前先拍快照，提示裡按「復原」就還原並重新同步
    function snapshot() {
      const key = getTodayKey();
      undoSnap = JSON.stringify({ items, key, day: checkinRecords[key] || {} });
    }
    function undo() {
      if (!undoSnap) return;
      const snap = JSON.parse(undoSnap); undoSnap = null;
      items = snap.items;
      checkinRecords[snap.key] = snap.day;
      triggerCloudSync(); renderAll(); showToast('已復原');
    }
    function commit(msg, undoable = true) {
      triggerCloudSync(); renderAll();
      if (msg) showToast(msg, false, undoable);
    }

    // ---------- dose sheet ----------
    // 只記 id：面板開著時若雲端同步換掉了 items，確認時仍要改到最新的那筆
    let doseId = null, doseVal = 1;
    function openDose(id) {
      const it = findItem(id); if (!it) return;
      const rec = (checkinRecords[getTodayKey()] || {})[it.id];
      doseId = it.id; doseVal = rec ? (Number(rec.daily) || doseOf(it)) : doseOf(it);
      $('#doseTitle').textContent = shortName(it.name);
      $('#doseDefault').checked = false;
      $('#doseConfirm').textContent = rec ? '更新這次的份量' : '打卡';
      updateDose(); openSheet('sheet-dose');
    }
    function updateDose() {
      $('#doseVal').textContent = doseVal;
      const it = findItem(doseId); if (!it) return;
      const d = doseOf(it);
      $('#doseMeta').textContent = doseVal === d ? `每次預設 ${d} 顆` : `每次預設 ${d} 顆，這次改成 ${doseVal} 顆`;
    }
    function confirmDose() {
      const it = findItem(doseId);
      if (!it) { closeSheets(); showToast('這個品項已經不存在了', true); return; }
      snapshot();
      const key = getTodayKey();
      if (!checkinRecords[key]) checkinRecords[key] = {};
      const rec = checkinRecords[key][it.id];
      if (rec) { applyPills(it, (Number(rec.daily) || doseOf(it)) - doseVal); rec.daily = doseVal; }
      else { checkinRecords[key][it.id] = { time: nowHM(), daily: doseVal }; applyPills(it, -doseVal); justChecked = String(it.id); }
      const setDefault = $('#doseDefault').checked; if (setDefault) it.daily = doseVal;
      closeSheets();
      commit(`「${shortName(it.name)}」這次吃 ${doseVal} 顆${setDefault ? '，已設為預設' : ''}`);
      justChecked = null;
    }

    function paintReset() {

    function setLeadDays(v) {

      renderInventoryView();
      if ($('#sheet-shop').classList.contains('open')) renderShop();

    function switchTab(t) {

      renderAll();
      const scr = $('#screen-' + t); scr.classList.remove('enter'); void scr.offsetWidth; scr.classList.add('enter');
