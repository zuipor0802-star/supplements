    function renderPickers() {
      $('#slotPick').innerHTML = SLOT_ORDER.map(s => `<button type="button" data-pick-slot="${s}" aria-pressed="${s === addSlot}">${SLOTS[s].name}</button>`).join('');
      $('#formPick').innerHTML = Object.keys(FORMS).map(f => `<button type="button" data-pick-form="${f}" aria-pressed="${f === addForm}"><i class="pill teal" aria-hidden="true">${FORM_SVG[f]}</i>${FORMS[f]}</button>`).join('');
    }

    // ---------- events ----------
    document.addEventListener('click', e => {
      const t = e.target.closest('button, a');
      if (!t) return;
      const d = t.dataset;

      if (d.tab) return switchTab(d.tab);
      if ('undo' in d) return undo();
      if ('close' in d) return closeSheets();
      if ('settings' in d) return openSettings();

      // 今天
      if (d.view) { viewDay = d.view === getTodayKey() ? null : d.view; return renderCheckinView(); }
      if (d.check) {
        snapshot();
        const it = findItem(d.check);
        const on = doToggle(d.check);
        if (on === null) return;
        justChecked = on ? String(it.id) : null;
        commit(on ? `已打卡「${shortName(it.name)}」，扣 ${doseOf(it)} 顆` : `已取消「${shortName(it.name)}」`);
        justChecked = null;
        return;
      }
      if (d.dose) return openDose(d.dose);
      if (t.id === 'doseMinus') { doseVal = Math.max(1, doseVal - 1); return updateDose(); }
      if (t.id === 'dosePlus') { doseVal = Math.min(50, doseVal + 1); return updateDose(); }
      if (t.id === 'doseConfirm') return confirmDose();
      if (d.slotAll) {
        snapshot();
        const key = getTodayKey(); if (!checkinRecords[key]) checkinRecords[key] = {};
        let n = 0;
        items.filter(it => slotOf(it) === d.slotAll && !checkinRecords[key][it.id]).forEach(it => { doToggle(it.id); n++; });
        return commit(`${SLOTS[d.slotAll].name}已打卡 ${n} 款`);
      }

      // 庫存
      if (d.filter) { currentFilterV4 = d.filter; return renderInventoryView(); }
      if (d.open) { openItem = String(openItem) === d.open ? null : d.open; pendingDelete = null; return renderInventoryView(); }
      if (d.step) {
        snapshot();
        const [id, f, dl] = d.step.split(':'); const it = findItem(id); if (!it) return;
        it[f] = Math.max(f === 'daily' ? 1 : 0, (Number(it[f]) || 0) + Number(dl));
        return commit();
      }
      if (d.setform) {
        const [id, f] = d.setform.split(':'); const it = findItem(id); if (!it) return;
        it.form = f; return commit();
      }
      if (d.receive) {
        snapshot();
        const it = findItem(d.receive); if (!it) return;
        const n = Number(it.purchased) || 0; if (n <= 0) return;
        it.bottles = (Number(it.bottles) || 0) + n; it.purchased = 0;
        return commit(`「${shortName(it.name)}」${n} 罐已轉入庫存`);
      }
      if (d.delete) {
        if (String(pendingDelete) !== d.delete) {
          pendingDelete = d.delete; renderInventoryView();
          clearTimeout(pendingDeleteTimer);
          pendingDeleteTimer = setTimeout(() => { pendingDelete = null; renderInventoryView(); }, 4000);
          return;
        }
        snapshot(); pendingDelete = null; clearTimeout(pendingDeleteTimer);
        const i = items.findIndex(it => String(it.id) === d.delete); if (i < 0) return;
        const [gone] = items.splice(i, 1); openItem = null;
        return commit(`已刪除「${shortName(gone.name)}」`);
      }
      if ('openShop' in d) { renderShop(); return openSheet('sheet-shop'); }
      if (d.qty) { const [id, dl] = d.qty.split(':'); shopQty[id] = Math.max(1, (shopQty[id] || 1) + Number(dl)); return renderShop(); }
      if ('markOrdered' in d) {
        snapshot();
        const list = items.filter(it => stats(it).status !== 'ok' && !(it.purchased > 0));
        list.forEach(it => { it.purchased = shopQty[it.id] || suggestQty(it); delete shopQty[it.id]; });
        return commit(`${list.length} 款已標記為已下單，到貨後按「轉入庫存」`);
      }
      if (t.id === 'fab') { renderPickers(); $('#f-name-err').hidden = true; return openSheet('sheet-add'); }
      if (d.pickSlot) { addSlot = d.pickSlot; return renderPickers(); }
      if (d.pickForm) { addForm = d.pickForm; return renderPickers(); }

      // 提醒
      if ('notify' in d) return requestNotificationPermission();
      if ('testSound' in d) { playChime(); return showToast('這是提醒的聲音'); }

      // 紀錄
      if (d.day) { selectedDay = d.day; return renderHistoryView(); }

      // 設定
      if (t.id === 'cloudSave') return saveAndConnectCloud();
      if (t.id === 'cloudClear') return clearCloudApi();
      if (d.lead) return setLeadDays(leadDays + Number(d.lead));
      if (t.id === 'resetBtn') {
        if (!pendingReset) {
          pendingReset = true; paintReset(); clearTimeout(pendingResetTimer);
          pendingResetTimer = setTimeout(() => { pendingReset = false; paintReset(); }, 4000);
          return;
        }
        snapshot(); pendingReset = false; clearTimeout(pendingResetTimer); paintReset();
        items = JSON.parse(JSON.stringify(DEFAULT_DATA));
        closeSheets();
        return commit('已重設為預設品項');
      }
    });
    $('#backdrop').addEventListener('click', closeSheets);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheets(); });

    document.addEventListener('change', e => {
      const el = e.target;
      if (el.dataset.set) {
        snapshot();
        const [id, f] = el.dataset.set.split(':'); const it = findItem(id); if (!it) return;
        it[f] = Math.max(f === 'daily' ? 1 : 0, parseInt(el.value, 10) || 0);
        return commit();
      }
      if (el.dataset.qtyset) { shopQty[el.dataset.qtyset] = Math.max(1, parseInt(el.value, 10) || 1); return renderShop(); }
      if (el.id === 'leadDays') return setLeadDays(parseInt(el.value, 10) || 0);
      if (el.dataset.time) {
        if (!el.value) return;
        reminderTimes[el.dataset.time] = el.value;
        localStorage.setItem(STORAGE_KEY_REMINDERS, JSON.stringify(reminderTimes));
        triggerCloudSync();
        renderCheckinView();
        return showToast(`${SLOTS[el.dataset.time].name}提醒改為 ${el.value}`);
      }
    });

    document.addEventListener('input', e => {
      const el = e.target;
      if (el.dataset.qtyset) { const v = parseInt(el.value, 10); if (v > 0) shopQty[el.dataset.qtyset] = v; }
    });

    $('#addForm').addEventListener('submit', e => {
      e.preventDefault();
      const name = $('#f-name').value.trim();
      $('#f-name-err').hidden = !!name;
      if (!name) { $('#f-name').focus(); return; }
      const num = (id, min) => Math.max(min, parseInt($(id).value, 10) || min);
      const url = $('#f-url').value.trim();
      snapshot();
      items.unshift({
        id: Date.now(), name, form: addForm,
        capacity: num('#f-cap', 1), daily: num('#f-daily', 1), bottles: num('#f-bottles', 0), loose: num('#f-loose', 0),
        purchased: 0, slot: addSlot, notes: $('#f-notes').value.trim(), url: /^https?:\/\//.test(url) ? url : ''
      });
      e.target.reset(); closeSheets();
      currentFilterV4 = 'all';
      commit(`已加入「${name}」`);
    });

    // ---------- start ----------
    initData();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') { checkReminders(); renderAll(); }
    });
    switchTab('checkin');

    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
    }
  </script>
</body>
</html>
